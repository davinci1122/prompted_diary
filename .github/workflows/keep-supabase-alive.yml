# Supabaseの無料プロジェクトが「放置による自動一時停止」されないように、
# 定期的にデータベースへ軽いAPIリクエスト（entriesテーブルを1件SELECT）を送るワークフロー。
#
# ＋ このワークフロー自身が「60日リポジトリ無更新で自動無効化される」のを防ぐため、
#    実行のたびに小さなハートビート用ファイルを更新してコミットします（＝リポジトリ活動を作る）。
#    これにより、あなたがアプリを一切更新しなくても、この自動処理は止まりません。
#
# ここに書いてある anon キーは「公開用の鍵」で、もともと index.html に公開済みのものです。
# （RLS＝行レベルセキュリティで保護されているため、公開されていても他人のデータは読めません）
# もし将来 Supabase 側でキーを再発行（rotate）した場合は、下の SUPABASE_ANON_KEY も更新してください。

name: Keep Supabase Alive

on:
  # 2日ごとに1回、UTC 03:17（日本時間 昼12:17ごろ）に自動実行。
  # ※Supabaseの一時停止は「約7日アクセスなし」で起きるため、2日ごとなら十分に余裕があります。
  schedule:
    - cron: "17 3 */2 * *"
  # 「Actions」画面から手動でも実行できるようにする（動作テスト用）。
  workflow_dispatch:

# このワークフローがリポジトリへコミット（push）できるように書き込み権限を付与。
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # コミット＆pushするためにリポジトリを取得（push用の認証情報も一緒に保存される）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: "https://rusiuqevmadfgilwcnfk.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1c2l1cWV2bWFkZmdpbHdjbmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNjQ1NTAsImV4cCI6MjA5ODc0MDU1MH0.AvZVT7CsaFOzyryAyiUQPHAeoZ_dzjEWS9p5oiBgeDg"
        run: |
          echo "Supabase に軽いSELECTリクエストを送信します..."
          # entries テーブルを1件だけ取得（RLSで中身が空[]でも、DBへSELECTした事実＝活動になるので十分）。
          # ※このテーブルには id 列が無いため select=* を使う（列名に依存せず必ず200が返る）。
          # -s: 進捗非表示 / -S: エラーは表示 / -o: 本文を保存 / -w: 最後にHTTPステータスコードを出力
          HTTP_CODE=$(curl -s -S -o /tmp/resp.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/entries?select=*&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTPステータス: ${HTTP_CODE}"
          echo "レスポンス本文:"
          cat /tmp/resp.json || true
          echo ""

          # 2xx（200など）なら成功。それ以外は失敗にしてメール通知が来るようにする。
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "✅ 成功：Supabaseは応答しています（自動停止を回避）"
          else
            echo "❌ 失敗：Supabaseが想定外の応答を返しました（プロジェクトが既に停止している可能性があります）"
            exit 1
          fi

      # ▼ ここが「60日で自動無効化されない」ための対策 ▼
      # 実行のたびにタイムスタンプを書き込んでコミットし、リポジトリに活動を作る。
      - name: Update heartbeat (prevents 60-day auto-disable)
        run: |
          mkdir -p .github
          echo "last keepalive run (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" > .github/keepalive-heartbeat.txt

          # コミット主を GitHub Actions bot に設定
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive-heartbeat.txt
          # 変更が無い場合（同じ内容）でもエラーにならないようにする
          if git diff --staged --quiet; then
            echo "変更なし：コミットをスキップ"
          else
            # [skip ci] を付けて、このコミットが余計なワークフローを呼ばないようにする
            git commit -m "chore: keepalive heartbeat [skip ci]"
            git push
            echo "✅ ハートビートをコミットしました（60日ルールのカウントをリセット）"
          fi
